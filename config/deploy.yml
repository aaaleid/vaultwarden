# Kamal v2.12.0 deployment configuration.
# Reference: https://kamal-deploy.org/docs/configuration/
#
# Secrets are resolved from .kamal/secrets. In CI they are supplied as
# environment variables by the GitHub Actions deploy workflow; for local
# deploys they must be exported in your shell.
#
# Requires Kamal >= 2.12.0.

service: vaultwarden
image: aaaleid/vaultwarden

minimum_version: 2.12.0

servers:
  web:
    hosts:
      - <%= ENV["SERVER_IP"] %>
    options:
      # Keep the container running across daemon restarts / reboots.
      restart: unless-stopped

registry:
  username: aaaleid
  password:
    - DOCKER_PA_TOKEN

# kamal-proxy provides gapless (zero-downtime) deployments and automatic
# Let's Encrypt TLS. Vaultwarden's health endpoint is /alive
# (see docker/healthcheck.sh for the in-container HEALTHCHECK definition).
proxy:
  ssl: true
  host: <%= ENV["DOMAIN_NAME"] %>
  app_port: 80
  healthcheck:
    path: /alive
    interval: 5
    timeout: 5

# How long to wait (seconds) for the app to become healthy during a deploy.
deploy_timeout: 60
# How long to wait for in-flight connections to drain before stopping a container.
drain_timeout: 30
# Grace period for the container to shut down cleanly after SIGTERM.
stop_grace_period: 30

ssh:
  user: ec2-user
  port: 22

volumes:
  - "/vw-data:/data"

# Docker log rotation: cap retained logs to 3 files of 10 MB each.
logging:
  options:
    max-size: "10m"
    max-file: "3"

env:
  clear:
    DOMAIN: "https://<%= ENV["DOMAIN_NAME"] %>"
    SIGNUPS_ALLOWED: "false"
    ROCKET_PORT: 80
    INVITATIONS_ALLOWED: "false"
    SHOW_PASSWORD_HINT: "false"
  secret:
    - ADMIN_TOKEN

builder:
  arch: amd64
  args:
    DB: "sqlite,mysql,postgresql"
    # Optional override for the embedded version string; when unset, build.rs
    # derives it from git (the deploy workflow checks out with fetch-depth: 0).
    <% if ENV["VW_VERSION"] && !ENV["VW_VERSION"].empty? %>
    VW_VERSION: <%= ENV["VW_VERSION"] %>
    <% end %>
  cache:
    type: gha