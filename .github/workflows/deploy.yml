name: Deploy Vaultwarden

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Git ref (branch, tag or SHA) to deploy instead of the triggering commit'
        required: false
        default: ''
        type: string

concurrency:
  # Only one production deployment (or rollback) at a time.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  checks: read
  actions: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_override || github.sha }}
          # Full history (incl. tags) so build.rs can resolve the app version
          # from git when VW_VERSION is not supplied.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Runtime for Docker Cache
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Kamal
        run: gem install kamal -v 2.12.0

      - name: Verify Kamal version
        run: |
          # Use the `version` subcommand: `kamal --version` prints the full
          # help text (the --version flag selects an app version instead).
          installed="$(kamal version)"
          echo "Installed Kamal: ${installed}"
          case "${installed}" in
            *2.12.0*) echo "Kamal version OK" ;;
            *) echo "::error::Unexpected Kamal version: ${installed}" && exit 1 ;;
          esac

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Prepare SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -t ed25519,rsa "$SERVER_IP" >> ~/.ssh/known_hosts
        env:
          SERVER_IP: ${{ vars.SERVER_IP }}

      - name: Wait for CI workflow runs to pass
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Wait for other GitHub Actions workflow runs on this commit to
          # complete before deploying. Our own run is excluded by id, so a
          # deploy-only commit (no other CI) proceeds immediately.
          auth="Authorization: Bearer ${GITHUB_TOKEN}"
          accept="Accept: application/vnd.github+json"
          url="https://api.github.com/repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100"
          timeout=1800
          interval=15
          elapsed=0

          total="$(curl -fsSL -H "$auth" -H "$accept" "$url" | jq -r '.total_count')"
          if [ "$total" -le 1 ]; then
            echo "::notice::No other CI workflow runs for ${SHA}; proceeding"
            exit 0
          fi

          while [ "$elapsed" -lt "$timeout" ]; do
            json="$(curl -fsSL -H "$auth" -H "$accept" "$url")"
            pending="$(echo "$json" | jq --argjson run "$RUN_ID" '[.workflow_runs[] | select(.id != $run) | select(.status != "completed")] | length')"
            failed="$(echo "$json" | jq --argjson run "$RUN_ID" '[.workflow_runs[] | select(.id != $run) | select(.status == "completed") | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure")] | length')"

            if [ "$failed" -gt 0 ]; then
              echo "::error::CI workflow runs failed for ${SHA}; aborting deployment"
              exit 1
            fi

            if [ "$pending" -eq 0 ]; then
              echo "::notice::All CI workflow runs passed for ${SHA}"
              exit 0
            fi

            echo "CI workflow runs pending for ${SHA} (${elapsed}s elapsed)..."
            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

          echo "::error::Timed out waiting for CI workflow runs on ${SHA} (${timeout}s)"
          exit 1

      - name: Create GitHub deployment
        id: deployment
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          ref: ${{ github.event.inputs.tag_override || github.sha }}

      - name: Deploy with Kamal
        run: kamal deploy --lock-wait
        env:
          SERVER_IP: ${{ vars.SERVER_IP }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DOCKER_PA_TOKEN: ${{ secrets.DOCKER_PA_TOKEN }}
          # Optional: force a specific version string into the built image
          # (build.rs falls back to `git describe` when unset).
          VW_VERSION: ${{ vars.VW_VERSION }}

      - name: Verify deployment health
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: |
          set -euo pipefail
          url="https://${DOMAIN_NAME}/alive"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$url" >/dev/null 2>&1; then
              echo "::notice::Deployment healthy (${url})"
              exit 0
            fi
            echo "Health check attempt ${i}/30 failed; retrying in 10s..."
            sleep 10
          done
          echo "::error::Deployment health check failed (${url})"
          exit 1

      - name: Mark deployment successful
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: success
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env: ${{ steps.deployment.outputs.env }}

      - name: Mark deployment failed
        if: ${{ failure() && steps.deployment.outcome == 'success' }}
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: failure
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env: ${{ steps.deployment.outputs.env }}
